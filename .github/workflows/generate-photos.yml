name: Generate Photo List & Thumbnails

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate thumbnails and photos.js
        run: npm run generate

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbnails photos.js
          git diff --staged --quiet || git commit -m "chore: auto-generate thumbnails and photos.js [skip ci]"
          git push
